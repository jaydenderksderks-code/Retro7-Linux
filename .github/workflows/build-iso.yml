name: Build and boot-test ISO

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-iso.yml"
      - "docs/**"
      - "iso/**"
      - "r7de/**"
      - "scripts/build-iso.sh"
      - "scripts/boot-test-iso.py"
      - "scripts/test-r7de-headless.sh"
  pull_request:
    paths:
      - ".github/workflows/build-iso.yml"
      - "docs/**"
      - "iso/**"
      - "r7de/**"
      - "scripts/build-iso.sh"
      - "scripts/boot-test-iso.py"
      - "scripts/test-r7de-headless.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retro7-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and boot-test x86_64 live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate boot test syntax
        run: |
          python3 -m py_compile scripts/boot-test-iso.py
          bash -n scripts/build-iso.sh scripts/test-r7de-headless.sh
      - name: Build ISO and smoke-test R7DE in Arch Linux
        shell: bash
        run: |
          docker run --privileged --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm archiso rust gtk4 gtk4-layer-shell vte4 labwc dbus
              bash ./scripts/build-iso.sh
              PATH="/workspace/.build/work/cargo-target/release:$PATH" dbus-run-session -- bash ./scripts/test-r7de-headless.sh
            '
      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes qemu-system-x86 ovmf
      - name: Boot-test BIOS and UEFI
        shell: bash
        run: |
          iso="$(find .build/out -maxdepth 1 -type f -name 'retro7-*-x86_64.iso' -print -quit)"
          test -n "$iso"
          python3 scripts/boot-test-iso.py --iso "$iso" --mode bios
          python3 scripts/boot-test-iso.py --iso "$iso" --mode uefi
      - name: Upload tested ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro7-live-x86_64
          path: .build/out/*.iso
          if-no-files-found: error
          retention-days: 7
